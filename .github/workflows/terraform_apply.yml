name: terraform apply

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.terraform-version'
      - '.github/workflows/terraform_*.yml'

jobs:
  apply:
    name: terraform apply
    runs-on: ubuntu-latest
    concurrency:
      # Prevent concurrent applies, but never cancel a running one to avoid a broken state
      group: terraform-apply-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Keyless authentication via Workload Identity Federation
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: 'projects/631578640507/locations/global/workloadIdentityPools/gh-oidc-pool/providers/gh-oidc-provider'
          service_account: 'terraform-github-actions@kagoole-379522.iam.gserviceaccount.com'

      - name: Check Terraform version
        id: check_tf_version
        working-directory: .
        run: |
          tf_version=$(cat .terraform-version)
          echo "tf_version=$tf_version" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.check_tf_version.outputs.tf_version }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve
