name: deploy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'job/**'

permissions:
  contents: 'read'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # pywrangler shells out to wrangler, which requires Node 22 or newer.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      # pywrangler, not wrangler: the `workers` module is not built into the
      # runtime at this compatibility date. It comes from workers-runtime-sdk,
      # which only pywrangler vendors into the bundle. Deploying with plain
      # wrangler produces a Worker that fails at import with
      # "ModuleNotFoundError: No module named 'workers'".
      - name: Deploy
        run: uv run --frozen pywrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
