version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      all-actions:
        patterns:
          - "*"

  # uv, not pip: every dependency lives in [dependency-groups] and in
  # uv.lock, neither of which the pip ecosystem reads.
  - package-ecosystem: "uv"
    directory: "/job"
    schedule:
      interval: "monthly"
    groups:
      patch:
        update-types:
          - "patch"
