[project]
name = "kagoole-twitter"
version = "0.1.0"
description = "Tweet when a new Kaggle competition is launched."
# Matches the Python that Pyodide provides at this compatibility date.
requires-python = ">=3.14"
# Intentionally empty: the Worker uses only the standard library plus the
# `workers` module. Note that `workers` still has to be vendored into the
# bundle, which is why deploys run through pywrangler rather than wrangler.
dependencies = []

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "black>=24",
    "pytest>=8",
]

[tool.uv]
# Nothing to build or install: this is a Worker, not a package.
package = false

[tool.pytest.ini_options]
# Mirrors the Worker's import path. Wrangler flattens the directory holding
# `main` onto sys.path, so entry.py says `from kaggle import ...`.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
target-version = ["py314"]
